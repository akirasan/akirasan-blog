<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo oscuro -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Rejilla técnica sutil -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M0 78 H1200 M0 156 H1200 M0 234 H1200 M0 312 H1200 M0 390 H1200 M0 468 H1200 M0 546 H1200" />
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630" />
  </g>

  <!-- Ventana de Terminal Principal -->
  <g filter="url(#glow)">
    <!-- Marco de la ventana -->
    <rect x="120" y="80" width="960" height="470" rx="12" fill="#090d16" stroke="#334155" stroke-width="2" />
    
    <!-- Barra superior -->
    <path d="M120 92 A12 12 0 0 1 132 80 H1068 A12 12 0 0 1 1080 92 V125 H120 Z" fill="#1e293b" />
    <circle cx="150" cy="102" r="6" fill="#ef4444" />
    <circle cx="170" cy="102" r="6" fill="#f59e0b" />
    <circle cx="190" cy="102" r="6" fill="#10b981" />
    <text x="600" y="107" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">bash - akirasan@zenbook:~ (AI Copilot)</text>

    <!-- Contenido de la consola -->
    <!-- Prompt 1 -->
    <text x="160" y="170" fill="#10b981" font-family="monospace" font-size="18" font-weight="bold">akirasan@zenbook:~$</text>
    <text x="380" y="170" fill="#f8fafc" font-family="monospace" font-size="18">gemini "auditar cuello de botella en swap"</text>

    <!-- Salida IA -->
    <text x="160" y="210" fill="#38bdf8" font-family="monospace" font-size="16">[AI Diagnóstico] Swapfile saturado al 94.2%. Activando zRAM con zstd...</text>

    <!-- Barras de métricas comparativas -->
    <!-- Antes -->
    <text x="160" y="270" fill="#94a3b8" font-family="monospace" font-size="15">Swap SSD (Original):</text>
    <rect x="360" y="255" width="450" height="18" rx="4" fill="#334155" />
    <rect x="360" y="255" width="424" height="18" rx="4" fill="#ef4444" />
    <text x="825" y="270" fill="#ef4444" font-family="monospace" font-size="15">94.2% (I/O Lag)</text>

    <!-- Después -->
    <text x="160" y="315" fill="#94a3b8" font-family="monospace" font-size="15">zRAM Compresión:</text>
    <rect x="360" y="300" width="450" height="18" rx="4" fill="#334155" />
    <rect x="360" y="300" width="230" height="18" rx="4" fill="url(#mintGrad)" />
    <text x="825" y="315" fill="#10b981" font-family="monospace" font-size="15">Ratio ~3.4:1 (RAM)</text>

    <!-- Frecuencia CPU -->
    <text x="160" y="360" fill="#94a3b8" font-family="monospace" font-size="15">Frecuencia CPU Reposo:</text>
    <text x="360" y="360" fill="#ef4444" font-family="monospace" font-size="15">2.8 GHz</text>
    <text x="450" y="360" fill="#94a3b8" font-family="monospace" font-size="15">➔</text>
    <text x="480" y="360" fill="#10b981" font-family="monospace" font-size="15" font-weight="bold">1.2 GHz (-57%) [TLP OK]</text>

    <!-- Prompt 2 -->
    <text x="160" y="420" fill="#10b981" font-family="monospace" font-size="18" font-weight="bold">akirasan@zenbook:~$</text>
    <text x="380" y="420" fill="#f8fafc" font-family="monospace" font-size="18">sudo sysctl --system &amp;&amp; tlp start</text>
    <text x="160" y="460" fill="#10b981" font-family="monospace" font-size="16">✔ Rendimiento optimizado: +85% fluidez global</text>

    <!-- Cursor parpadeante -->
    <rect x="620" y="446" width="10" height="18" fill="#38bdf8" />
  </g>
</svg>
