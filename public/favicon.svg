<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Degradado azul eléctrico: cian luminoso arriba a cobalto intenso abajo -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Sombra suave para dar volumen y despegarla del fondo -->
    <filter id="aShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#040d1a" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Letra A condensada ocupando todo el marco -->
  <path 
    filter="url(#aShadow)"
    d="M 50 4 
       L 88 96 
       L 67 96 
       L 59 74 
       L 41 74 
       L 33 96 
       L 12 96 Z 
       M 50 28 
       L 44.5 58 
       L 55.5 58 Z" 
    fill="url(#aGrad)" 
    stroke="#071b36" 
    stroke-width="3" 
    stroke-linejoin="round" />
</svg>
