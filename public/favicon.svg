<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brillo sutil tech para resaltar sobre fondos oscuros o claros -->
    <filter id="techGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#0284c7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Letra 'A' técnica: cuerpo sólido blanco/neutro con contorno cian de alto contraste -->
  <path 
    d="M 32 8 L 47 38 L 40 38 L 35.5 29 L 28.5 29 L 24 38 L 17 38 Z" 
    fill="#f8fafc" 
    stroke="#0284c7" 
    stroke-width="2.5" 
    stroke-linejoin="round"
    filter="url(#techGlow)"
  />

  <!-- Vano interior recortado con puente LED verde de estado -->
  <polygon points="32,15 34.5,23 29.5,23" fill="#0284c7"/>
  <rect x="27.5" y="24" width="9" height="3" rx="1.5" fill="#10b981"/>

  <!-- Puntos de prueba / vias electrónicas en las bases -->
  <circle cx="20.5" cy="38" r="1.5" fill="#0284c7"/>
  <circle cx="43.5" cy="38" r="1.5" fill="#0284c7"/>

  <!-- Nombre 'akirasan' directo sobre transparencia con contraste para ambos modos -->
  <text 
    x="32" 
    y="54" 
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
    font-size="7.5" 
    font-weight="800" 
    fill="#0284c7" 
    stroke="#f8fafc"
    stroke-width="0.6"
    paint-order="stroke fill"
    text-anchor="middle" 
    letter-spacing="0.5"
  >akirasan</text>
</svg>
